<!DOCTYPE html>
<html>
<head>
<title>Minhas Notas</title>

<style>
body{
font-family:Arial;
background:#f4f6f8;
text-align:center;
}

h1{
color:#333;
}

.container{
width:400px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

textarea{
width:100%;
height:80px;
margin-top:10px;
}

button{
margin-top:10px;
padding:10px;
background:#2d89ef;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

.nota{
background:#fafafa;
margin-top:10px;
padding:10px;
border-radius:5px;
}
</style>
</head>

<body>

<h1>📒 Minhas Notas</h1>

<div class="container">

<input type="file" id="foto">

<textarea id="nota" placeholder="Escreva sua nota"></textarea>

<button onclick="salvar()">Salvar</button>

<div id="lista"></div>

</div>

<script>
function salvar(){

let texto=document.getElementById("nota").value
let foto=document.getElementById("foto").files[0]

let div=document.createElement("div")
div.className="nota"

if(foto){
let img=document.createElement("img")
img.src=URL.createObjectURL(foto)
img.style.width="100%"
div.appendChild(img)
}

let p=document.createElement("p")
p.textContent=texto

div.appendChild(p)

document.getElementById("lista").appendChild(div)

}
</script>

</body>
</html>
